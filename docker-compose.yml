# ---------------------------------------------------------------------------
# ERP LaMethode — services de développement
# Démarrer la base :  docker compose up -d db
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    container_name: lamethode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - lamethode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lamethode_pgdata:
